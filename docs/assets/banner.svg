<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">agentmem</title>
  <desc id="bannerDesc">agentmem — a knowledge hub for AI agents. One authoritative OKF+Git body, pluggable RAG channels, rule-first smart routing.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b1b1b" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0b0b" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#0b0b0b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0b0b0b" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="#0b0b0b"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" fill="none" stroke="#262626" stroke-width="1"/>

  <!-- channel graph: four projections converging on one canonical body -->
  <g stroke="#3a3a3a" stroke-width="1.2" fill="none">
    <path d="M960 78 L1090 140"/>
    <path d="M960 132 L1090 152"/>
    <path d="M960 188 L1090 166"/>
    <path d="M960 242 L1090 178"/>
    <path d="M1090 140 L1180 160"/>
    <path d="M1090 152 L1180 160"/>
    <path d="M1090 166 L1180 160"/>
    <path d="M1090 178 L1180 160"/>
  </g>
  <g fill="#0b0b0b" stroke="#8a8a8a" stroke-width="1.4">
    <circle cx="960" cy="78" r="9"/>
    <circle cx="960" cy="132" r="9"/>
    <circle cx="960" cy="188" r="9"/>
    <circle cx="960" cy="242" r="9"/>
    <circle cx="1090" cy="140" r="7"/>
    <circle cx="1090" cy="152" r="7"/>
    <circle cx="1090" cy="166" r="7"/>
    <circle cx="1090" cy="178" r="7"/>
  </g>
  <circle cx="1180" cy="160" r="15" fill="#f2f2f2"/>
  <circle cx="1180" cy="160" r="24" fill="none" stroke="#5c5c5c" stroke-width="1.2"/>

  <g fill="#9a9a9a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="0.6">
    <text x="908" y="82" text-anchor="end">llamaindex</text>
    <text x="908" y="136" text-anchor="end">pageindex</text>
    <text x="908" y="192" text-anchor="end">graphrag</text>
    <text x="908" y="246" text-anchor="end">lightrag</text>
    <text x="1204" y="165" fill="#c9c9c9">OKF + Git</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="142" fill="#f5f5f5" font-size="68" font-weight="600" letter-spacing="-1.5">agentmem</text>
    <text x="82" y="186" fill="#c9c9c9" font-size="23" letter-spacing="0.2">A knowledge hub for AI agents</text>
    <text x="82" y="230" fill="#7d7d7d" font-size="15" letter-spacing="0.3">One authoritative OKF + Git body · pluggable RAG channels · rule-first routing</text>
  </g>

