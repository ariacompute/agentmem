<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agentmem</title>
    <meta name="description" content="agentmem status console and HTTP API documentation." />
    <script>
      // Resolve the theme before the first paint. A parser-blocking classic
      // script in the head avoids a dark frame on a light-configured machine,
      // and stays inline so the page also works when served as plain files.
      ;(function () {
        try {
          var stored = window.localStorage.getItem('agentmem.theme')
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
