<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agentmem</title>
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; background: #f8fafc; color: #0f172a; }
      main { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      p.sub { color: #475569; margin: 0 0 24px; font-size: 14px; }
      section { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; margin-bottom: 18px; }
      h2 { font-size: 15px; margin: 0 0 12px; }
      .kv { display: flex; gap: 12px; padding: 6px 0; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
      .kv:last-child { border-bottom: none; }
      .kv b { min-width: 210px; font-weight: 600; color: #334155; }
      code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
      .err { color: #b91c1c; font-size: 13px; }
      .empty { color: #64748b; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
