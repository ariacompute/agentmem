name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; individual jobs may narrow further.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: Verify module checksums
        run: go mod verify
      - name: Download dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test (offline, no services)
        run: go test ./... -count=1
      - name: Build
        run: go build -o bin/agentmem ./cmd/agentmem
      - name: Validate .env.example
        run: go run ./cmd/agentmem validate --env .env.example
      - name: Declarative SDK boundaries
        run: make check-boundaries
      # Offline fingerprint scan: online probes are unreliable behind
      # forward/intercepting proxies and are deliberately not used.
      - name: Trust store (eMudhra/emSign CA compromise)
        run: make check-trust-store
      - name: Computation smoke test (offline)
        run: go test ./internal/compute/... -count=1
      - name: Evaluation smoke test
        run: go run ./cmd/agentmem eval --dataset testdata/eval.jsonl --k 5

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - name: Test and build the web console
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build

  # Optional: only runs on manual dispatch; the default test suite never needs
  # a database. Set AGENTMEM_TEST_PG_DSN to exercise the real GORM backend.
  postgres-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        # Throwaway credentials for an ephemeral CI service container only.
        # They are never production secrets; sslmode=disable is local-only.
        env:
          POSTGRES_DB: agentmem_test
          POSTGRES_USER: agentmem
          POSTGRES_PASSWORD: agentmem_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentmem -d agentmem_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: Integration test
        env:
          AGENTMEM_TEST_PG_DSN: postgres://agentmem:agentmem_test@127.0.0.1:5432/agentmem_test?sslmode=disable
        run: go test ./internal/meta -run TestPostgresIntegration -v -count=1
