name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Build release binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/agentmem-linux-amd64 ./cmd/agentmem
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/agentmem-linux-arm64 ./cmd/agentmem
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/agentmem-darwin-arm64 ./cmd/agentmem
      - uses: actions/upload-artifact@v4
        with:
          name: agentmem-binaries
          path: dist/

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
