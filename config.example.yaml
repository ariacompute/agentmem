# agentmem configuration. Copy to config.yaml and adjust.
# Secrets must NOT be written here: use AGENTMEM_PG_DSN at runtime.

server:
  addr: "127.0.0.1:8080"
  # production requires postgres.dsn; dev falls back to the in-memory fake.
  mode: "dev"

git:
  # Root of the OKF bundle. Git is the authority for knowledge bodies.
  root: "./data/bundle"
  author_name: "agentmem"
  author_email: "agentmem@localhost"

postgres:
  # Injected via AGENTMEM_PG_DSN; leave empty for offline/dev fake.
  dsn: ""
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: "30m"
  log_level: "warn"
  # Separate DSN for pgvector; empty reuses postgres.dsn.
  vector_dsn: ""

router:
  # Deterministic rules always run first; only ambiguous items reach System One.
  systemone:
    endpoint: ""            # e.g. http://127.0.0.1:8010
    timeout_ms: 5000
    cache_capacity: 256
    max_choices: 255
    min_confidence: 0.5
    fallback: "okf"         # must be one of the eligible targets
    fail_closed: true
  # Conflict policy is fixed: the OKF+Git body always wins.
  conflict_policy: "okf_wins"

compute:
  # Executor bound; 0 uses the built-in default (5000ms / 100 rows).
  timeout_ms: 5000
  max_rows: 100

adapters:
  - name: "okf"
    kind: "okf"
    enabled: true
  - name: "memory"
    kind: "memory"
    enabled: true
  - name: "pgvector"
    kind: "pgvector"
    enabled: false
  # First-class engine plugins. Each owns a plugin.yaml declaring its
  # sdk_boundary (sidecar, wire protocol, endpoints, credential reference).
  # An empty endpoint selects the deterministic offline mock.
  # The legacy generic kinds "http" / "cli" remain available for custom engines.
  - name: "llamaindex"
    kind: "llamaindex"
    enabled: false
    endpoint: ""
    timeout_ms: 3000
  - name: "pageindex"
    kind: "pageindex"
    enabled: false
    endpoint: ""
    timeout_ms: 3000
  - name: "graphrag"
    kind: "graphrag"     # CLI stdio line protocol
    enabled: false
    endpoint: ""
    timeout_ms: 3000
  - name: "lightrag"
    kind: "lightrag"
    enabled: false
    endpoint: ""
    timeout_ms: 3000

acl:
  default_visibility: "private"
  default_owner: "system"
