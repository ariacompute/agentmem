services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agentmem
      POSTGRES_USER: agentmem
      POSTGRES_PASSWORD: agentmem_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmem -d agentmem"]
      interval: 5s
      timeout: 3s
      retries: 10

  agentmem:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENTMEM_MODE: production
      AGENTMEM_ADDR: 0.0.0.0:8080
      AGENTMEM_GIT_ROOT: /app/data/bundle
      AGENTMEM_PG_DSN: postgres://agentmem:agentmem_dev@postgres:5432/agentmem?sslmode=disable
    ports:
      - "8080:8080"
    volumes:
      - agentmem_data:/app/data
    command: ["serve", "--config", "/app/config.example.yaml"]

volumes:
  pgdata:
  agentmem_data:
